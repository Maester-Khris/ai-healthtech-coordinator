AWSTemplateFormatVersion: "2010-09-09"
Resources:
  MedicoordRawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: medicoord-raw-ingestion
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true # every PUT fires an EventBridge event
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-after-30-days
            Status: Enabled
            ExpirationInDays: 30 # raw files auto-delete, you don't pay forever
