<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <rect width="1280" height="320" fill="#061219"/>

  <!-- Box 1 -->
  <rect x="40" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Facility</text>
  <text x="160" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Directory Read</text>
  <foreignObject x="52" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">In-process dict, ETag over sorted-key JSON — no per-request Supabase query.</p>
    </body>
  </foreignObject>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="140" x2="318" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="318,134 330,140 318,146" fill="#48F6C1"/>

  <!-- Box 2 -->
  <rect x="330" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Wait-Time</text>
  <text x="450" y="115" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Cache-Aside</text>
  <text x="450" y="132" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Read</text>
  <foreignObject x="342" y="144" width="216" height="66">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Redis hash wait_times:current checked first, written by the scraper every ~15 min.</p>
    </body>
  </foreignObject>

  <!-- Arrow 2→3 -->
  <line x1="570" y1="140" x2="608" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="608,134 620,140 608,146" fill="#48F6C1"/>

  <!-- Box 3 -->
  <rect x="620" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="740" y="110" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Supabase Fallback</text>
  <foreignObject x="632" y="122" width="216" height="88">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">On Redis miss or error, latest_wait_times RPC runs and best-effort repopulates Redis.</p>
    </body>
  </foreignObject>

  <!-- Arrow 3→4 -->
  <line x1="860" y1="140" x2="898" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="898,134 910,140 898,146" fill="#48F6C1"/>

  <!-- Box 4 -->
  <rect x="910" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="1030" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Graceful</text>
  <text x="1030" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Degradation</text>
  <foreignObject x="922" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">If both fail, return an empty map — missing wait data always passes filters.</p>
    </body>
  </foreignObject>

  <!-- Caption -->
  <text x="640" y="272" text-anchor="middle" font-family="monospace" font-size="11" fill="#7AA0B0" letter-spacing="2">FIG 3.1: TWO-TIER STATE READ PATH</text>
</svg>
