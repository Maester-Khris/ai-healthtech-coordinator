<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <rect width="1280" height="320" fill="#061219"/>

  <!-- Box 1 -->
  <rect x="40" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#00D2FF" stroke-width="2"/>
  <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Location +</text>
  <text x="160" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Severity In</text>
  <foreignObject x="52" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Patient GPS coordinates and classified severity from Pass 1 of triage.</p>
    </body>
  </foreignObject>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="140" x2="318" y2="140" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="318,134 330,140 318,146" fill="#00D2FF"/>

  <!-- Box 2 -->
  <rect x="330" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#00D2FF" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">In-Process</text>
  <text x="450" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Cache Read</text>
  <foreignObject x="342" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Full facility list read from the app-layer cache — no per-request database query.</p>
    </body>
  </foreignObject>

  <!-- Arrow 2→3 -->
  <line x1="570" y1="140" x2="608" y2="140" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="608,134 620,140 608,146" fill="#00D2FF"/>

  <!-- Box 3 -->
  <rect x="620" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#00D2FF" stroke-width="2"/>
  <text x="740" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Severity</text>
  <text x="740" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Eligibility Filter</text>
  <foreignObject x="632" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Keep only facilities where accepted_severity includes the requested level.</p>
    </body>
  </foreignObject>

  <!-- Arrow 3→4 -->
  <line x1="860" y1="140" x2="898" y2="140" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="898,134 910,140 898,146" fill="#00D2FF"/>

  <!-- Box 4 -->
  <rect x="910" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#00D2FF" stroke-width="2"/>
  <text x="1030" y="110" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Haversine Ranking</text>
  <foreignObject x="922" y="122" width="216" height="88">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Sort eligible facilities by great-circle distance; return top N with distanceKm attached.</p>
    </body>
  </foreignObject>

  <!-- Caption -->
  <text x="640" y="272" text-anchor="middle" font-family="monospace" font-size="11" fill="#7AA0B0" letter-spacing="2">FIG 2.1: PROXIMITY FILTER-THEN-RANK PIPELINE</text>
</svg>
