<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <rect width="1280" height="320" fill="#061219"/>

  <!-- Box 1 -->
  <rect x="40" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">User Message In</text>
  <foreignObject x="52" y="118" width="216" height="90">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Chat turn appended to trimmed conversation history (last TRIAGE_CONTEXT_WINDOW messages).</p>
    </body>
  </foreignObject>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="140" x2="318" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="318,134 330,140 318,146" fill="#48F6C1"/>

  <!-- Box 2 -->
  <rect x="330" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Pass 1:</text>
  <text x="450" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Forced Tool Call</text>
  <foreignObject x="342" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">LLM emits triage_response — severity, reasoning, information_sufficient. No facility data yet.</p>
    </body>
  </foreignObject>

  <!-- Arrow 2→3 -->
  <line x1="570" y1="140" x2="608" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="608,134 620,140 608,146" fill="#48F6C1"/>

  <!-- Box 3 -->
  <rect x="620" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="740" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Deterministic</text>
  <text x="740" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Facility Lookup</text>
  <foreignObject x="632" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Python calls find_nearest_facilities() against the in-process cache — no LLM involved.</p>
    </body>
  </foreignObject>

  <!-- Arrow 3→4 -->
  <line x1="860" y1="140" x2="898" y2="140" stroke="#48F6C1" stroke-width="2"/>
  <polygon points="898,134 910,140 898,146" fill="#48F6C1"/>

  <!-- Box 4 -->
  <rect x="910" y="60" width="240" height="160" rx="12" fill="#0A1D27" stroke="#48F6C1" stroke-width="2"/>
  <text x="1030" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Pass 2:</text>
  <text x="1030" y="122" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E2F1F5">Grounded Response</text>
  <foreignObject x="922" y="132" width="216" height="78">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="margin:0;font-family:monospace;font-size:11px;color:#85A4B1;text-align:center;line-height:1.5">Real facility name injected into a system message; LLM writes the patient-facing reply.</p>
    </body>
  </foreignObject>

  <!-- Caption -->
  <text x="640" y="272" text-anchor="middle" font-family="monospace" font-size="11" fill="#7AA0B0" letter-spacing="2">FIG 1.1: TWO-PASS TRIAGE PIPELINE</text>
</svg>
