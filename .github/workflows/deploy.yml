name: Deploy

on:
  push:
    branches:
      - preview

jobs:
  detect-changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Trigger Render deploy webhook
        run: |
          echo "Backend changes detected — triggering Render deploy"
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_MEDICOORD }}"

      - name: Confirm webhook accepted
        run: echo "Render deploy webhook triggered successfully"

  skip-backend:
    name: No backend changes — skip Render deploy
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'false'

    steps:
      - run: echo "No backend changes — Render deploy skipped"
